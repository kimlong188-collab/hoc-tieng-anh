<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Ôn Luyện 1000 Từ Vựng Tiếng Anh Cốt Lõi</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --secondary: #64748b;
      --success: #16a34a;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #7c3aed;
      --accent-light: #ede9fe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px 20px 120px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      color: white;
      padding: 24px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.15);
    }

    header h1 {
      font-size: 24px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 18px 22px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    /* Tracker Bar */
    .tracker-card {
      background: #eff6ff;
      border: 1.5px solid #bfdbfe;
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .tracker-info {
      font-size: 14px;
      color: #1e3a8a;
    }
    .tracker-info strong {
      color: var(--primary);
      font-size: 16px;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .tab-btn {
      flex: 1;
      min-width: 130px;
      padding: 11px 12px;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-weight: 600;
      font-size: 13.5px;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: var(--primary-hover);
    }
    .btn-new-quiz {
      background-color: #059669;
    }
    .btn-new-quiz:hover {
      background-color: #047857;
    }
    .btn-reset-all {
      background-color: var(--danger);
    }
    .btn-reset-all:hover {
      background-color: var(--danger-hover);
    }
    .btn-check-item {
      background-color: #4338ca;
      font-size: 12.5px;
      padding: 6px 12px;
    }
    .btn-check-item:hover {
      background-color: #3730a3;
    }
    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 1.5px solid var(--primary);
    }
    .btn-outline:hover {
      background: #eff6ff;
    }
    .btn-speaker {
      background: #e0e7ff;
      color: #3730a3;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12.5px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-speaker:hover {
      background: #c7d2fe;
    }
    .btn-speaker-accent {
      background: var(--accent-light);
      color: var(--accent);
      border: 1px solid #ddd6fe;
    }
    .btn-speaker-accent:hover {
      background: #ddd6fe;
    }

    /* Question Item */
    .question-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }
    .q-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .q-number {
      font-weight: 700;
      color: var(--primary);
      font-size: 14.5px;
    }
    .prompt-text {
      font-size: 15.5px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #0f172a;
    }
    .sub-prompt {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .audio-passage-card {
      background: #faf5ff;
      border: 1.5px solid #e9d5ff;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
      border-left: 5px solid var(--accent);
    }
    .audio-bar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .audio-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .passage-script {
      background: #ffffff;
      border: 1px dashed #d8b4fe;
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 14.5px;
      line-height: 1.8;
      color: #334155;
      margin-top: 12px;
      display: none;
    }
    .btn-toggle-script {
      background: transparent;
      color: var(--accent);
      border: none;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      padding: 4px 0;
    }

    .input-answer {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14.5px;
      margin-top: 4px;
      margin-bottom: 8px;
      outline: none;
    }
    .input-answer:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .q-action-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 8px;
      margin-bottom: 8px;
    }
    .option-label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14.5px;
    }
    .option-label:hover {
      background: #eff6ff;
      border-color: #93c5fd;
    }
    .option-label.selected {
      background: #ede9fe;
      border-color: var(--accent);
      font-weight: 600;
      color: #4c1d95;
    }

    /* Feedback */
    .feedback {
      margin-top: 10px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13.5px;
      display: none;
      line-height: 1.6;
    }
    .feedback.correct {
      background: #dcfce7;
      color: #15803d;
      border: 1.5px solid #86efac;
    }
    .feedback.wrong {
      background: #fef2f2;
      color: #991b1b;
      border: 1.5px solid #fecaca;
    }

    /* Fixed bottom bar */
    .action-bar-fixed {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 2px solid var(--border);
      box-shadow: 0 -4px 15px rgba(0,0,0,0.08);
      padding: 12px 20px;
      z-index: 100;
    }
    .action-bar-content {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .action-buttons-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .score-badge {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
    }
    .score-badge span {
      color: var(--primary);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Hệ Thống Ôn Luyện 1000 Từ Vựng Tiếng Anh Cốt Lõi</h1>
    <p>Phần 4: Nghe Phản Xạ 100% Tiếng Anh • Tốc Độ Đọc 0.8x • Chấm Điểm Từng Câu</p>
  </header>

  <!-- Thanh tiến trình -->
  <div class="tracker-card">
    <div class="tracker-info">
      📚 Đã đưa vào bài tập: <strong id="usedCountText">0</strong> / <span id="totalVocabText">0</span> từ
      &nbsp;|&nbsp; Chưa dùng: <strong id="remainCountText" style="color:#059669;">0</strong> từ
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-reset-all" style="font-size: 12.5px; padding: 6px 12px;" onclick="resetAll()">
        🔄 Reset toàn bộ
      </button>
      <label class="btn btn-outline" style="font-size: 12.5px; padding: 6px 10px; cursor:pointer;">
        📂 Nạp Excel
        <input type="file" id="manualFileInput" accept=".xlsx, .xls, .csv" style="display: none;">
      </label>
    </div>
  </div>

  <!-- Tabs Navigation -->
  <div class="nav-tabs">
    <button class="tab-btn" onclick="switchTab('part1')">Phần 1: Dịch câu (20 câu)</button>
    <button class="tab-btn" onclick="switchTab('part2')">Phần 2: Điền vào chỗ trống (20 câu)</button>
    <button class="tab-btn" onclick="switchTab('part3')">Phần 3: Lựa chọn từ (20 câu)</button>
    <button class="tab-btn active" onclick="switchTab('part4')">Phần 4: Nghe Phản Xạ Đoạn Văn (20 câu)</button>
  </div>

  <!-- Dynamic Quiz Content -->
  <div id="quizContainer"></div>
</div>

<!-- Thanh công cụ cố định ở đáy -->
<div class="action-bar-fixed">
  <div class="action-bar-content">
    <div class="action-buttons-group">
      <button class="btn btn-reset-all" onclick="resetAll()">
        🔄 Reset toàn bộ
      </button>
      <button class="btn btn-new-quiz" onclick="generateNewQuizzes(true)">
        🎲 Làm đề 20 câu MỚI
      </button>
    </div>
    <div class="score-badge" id="scoreDisplay">Điểm: Đang làm bài</div>
    <button class="btn" onclick="checkAllAnswers()">
      ✅ Chấm điểm tất cả & Xem tổng kết
    </button>
  </div>
</div>

<script>
// Dữ liệu mặc định 25 từ cốt lõi
const defaultData = [
  { word: "achieve", meaning: "đạt được, hoàn thành", example: "He worked hard to achieve his business goals.", trans: "Anh ấy đã nỗ lực làm việc để đạt được mục tiêu kinh doanh của mình." },
  { word: "supply", meaning: "cung cấp, nguồn cung", example: "The factory cannot supply enough goods on time.", trans: "Nhà máy không thể cung cấp đủ hàng hóa đúng hạn." },
  { word: "negotiate", meaning: "đàm phán, thương lượng", example: "We need to negotiate the price with the supplier.", trans: "Chúng tôi cần đàm phán mức giá với nhà cung cấp." },
  { word: "contract", meaning: "hợp đồng", example: "Both parties agreed to sign the contract tomorrow.", trans: "Cả hai bên đã đồng ý ký hợp đồng vào ngày mai." },
  { word: "quality", meaning: "chất lượng", example: "Our company always focuses on product quality.", trans: "Công ty chúng tôi luôn chú trọng vào chất lượng sản phẩm." },
  { word: "delivery", meaning: "giao hàng, sự vận chuyển", example: "The delivery was delayed due to severe weather.", trans: "Việc giao hàng bị trì hoãn do thời tiết khắc nghiệt." },
  { word: "budget", meaning: "ngân sách", example: "We must complete this project within the budget.", trans: "Chúng ta phải hoàn thành dự án này trong phạm vi ngân sách." },
  { word: "customer", meaning: "khách hàng", example: "Customer satisfaction is our highest priority.", trans: "Sự hài lòng của khách hàng là ưu tiên cao nhất của chúng tôi." },
  { word: "efficient", meaning: "hiệu quả, năng suất", example: "We need to find an efficient way to manufacture goods.", trans: "Chúng ta cần tìm ra phương thức hiệu quả để sản xuất hàng hóa." },
  { word: "confirm", meaning: "xác nhận", example: "Please confirm your flight details by email.", trans: "Vui lòng xác nhận thông tin chuyến bay của bạn qua email." },
  { word: "requirement", meaning: "yêu cầu, điều kiện", example: "The supplier met all our quality requirements.", trans: "Nhà cung cấp đã đáp ứng tất cả yêu cầu chất lượng của chúng tôi." },
  { word: "schedule", meaning: "lịch trình, kế hoạch", example: "The production schedule will be updated next Monday.", trans: "Lịch trình sản xuất sẽ được cập nhật vào thứ Hai tuần tới." },
  { word: "strategy", meaning: "chiến lược", example: "They developed a new marketing strategy.", trans: "Họ đã phát triển một chiến lược tiếp thị mới." },
  { word: "inventory", meaning: "hàng tồn kho", example: "We check the warehouse inventory every month.", trans: "Chúng tôi kiểm tra hàng tồn kho trong kho hàng mỗi tháng." },
  { word: "payment", meaning: "thanh toán", example: "Payment must be made within 30 days of the invoice.", trans: "Việc thanh toán phải được thực hiện trong vòng 30 ngày kể từ khi có hóa đơn." },
  { word: "partnership", meaning: "quan hệ đối tác", example: "We established a long-term partnership with them.", trans: "Chúng tôi đã thiết lập mối quan hệ đối tác lâu dài với họ." },
  { word: "revenue", meaning: "doanh thu", example: "The annual revenue increased by 15 percent.", trans: "Doanh thu hàng năm đã tăng thêm 15 phần trăm." },
  { word: "responsible", meaning: "chịu trách nhiệm", example: "She is responsible for handling international shipments.", trans: "Cô ấy chịu trách nhiệm xử lý các lô hàng quốc tế." },
  { word: "deadline", meaning: "hạn chót", example: "We must submit the quotation before the deadline.", trans: "Chúng ta phải gửi bảng báo giá trước hạn chót." },
  { word: "warranty", meaning: "bảo hành", example: "The machine comes with a two-year warranty.", trans: "Máy móc đi kèm với chế độ bảo hành hai năm." },
  { word: "inquire", meaning: "hỏi thăm, điều tra", example: "I am writing to inquire about your product catalog.", trans: "Tôi viết thư để hỏi thăm về danh mục sản phẩm của bạn." },
  { word: "collaborate", meaning: "hợp tác", example: "Our team will collaborate closely with the engineers.", trans: "Đội ngũ chúng tôi sẽ hợp tác chặt chẽ với các kỹ sư." },
  { word: "inspection", meaning: "kiểm tra chất lượng", example: "The goods passed the strict quality inspection.", trans: "Hàng hóa đã vượt qua cuộc kiểm tra chất lượng nghiêm ngặt." },
  { word: "discount", meaning: "chiết khấu, giảm giá", example: "Can you offer a special discount for bulk orders?", trans: "Bạn có thể chiết khấu đặc biệt cho đơn hàng lớn không?" },
  { word: "solution", meaning: "giải pháp", example: "We will propose an innovative solution to the client.", trans: "Chúng tôi sẽ đề xuất một giải pháp sáng tạo cho khách hàng." }
];

let vocabList = [...defaultData];
let usedWordsSet = new Set();
let currentTab = 'part4'; // Mặc định mở phần nghe phản xạ

function speak(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.8;
    window.speechSynthesis.speak(utterance);
  }
}

function toggleScript(id) {
  const el = document.getElementById(id);
  const btn = document.getElementById('btn_' + id);
  if (el.style.display === 'block') {
    el.style.display = 'none';
    btn.innerText = '👁️ View Audio Transcript (Xem bài đọc)';
  } else {
    el.style.display = 'block';
    btn.innerText = '🙈 Hide Audio Transcript (Ẩn bài đọc)';
  }
}

function updateTrackerUI() {
  document.getElementById('totalVocabText').innerText = vocabList.length;
  document.getElementById('usedCountText').innerText = usedWordsSet.size;
  document.getElementById('remainCountText').innerText = Math.max(0, vocabList.length - usedWordsSet.size);
}

function resetAll() {
  usedWordsSet.clear();
  generateNewQuizzes(true);
}

function getUnusedItems(n) {
  let unusedPool = vocabList.filter(item => !usedWordsSet.has(item.word.toLowerCase()));
  if (unusedPool.length < n) {
    usedWordsSet.clear();
    unusedPool = [...vocabList];
  }

  const shuffled = [...unusedPool].sort(() => 0.5 - Math.random());
  const selected = shuffled.slice(0, Math.min(n, shuffled.length));
  selected.forEach(item => usedWordsSet.add(item.word.toLowerCase()));
  return selected;
}

let part1Data = [];
let part2Data = [];
let part3Data = [];
let part4Data = [];

function generateNewQuizzes(scrollUp = true) {
  document.getElementById('scoreDisplay').innerHTML = `Điểm: Đang làm bài`;

  // 1. Dịch câu
  part1Data = getUnusedItems(20).map(item => ({
    ...item,
    userAnswer: '',
    checked: false
  }));

  // 2. Điền chỗ trống
  part2Data = getUnusedItems(20).map(item => {
    const regex = new RegExp(`\\b${item.word}\\b`, 'gi');
    let blankSentence = item.example.replace(regex, '______');
    if (!blankSentence.includes('______')) {
      const words = item.example.split(' ');
      if (words.length > 2) {
        words[1] = '______';
        blankSentence = words.join(' ');
      }
    }
    return {
      ...item,
      blankSentence,
      userAnswer: '',
      checked: false
    };
  });

  // 3. Lựa chọn từ
  part3Data = getUnusedItems(20).map(item => {
    const regex = new RegExp(`\\b${item.word}\\b`, 'gi');
    const maskedSentence = item.example.replace(regex, '( ... )');
    const distractors = vocabList.filter(v => v.word.toLowerCase() !== item.word.toLowerCase());
    const randomDistractors = [...distractors].sort(() => 0.5 - Math.random()).slice(0, 3).map(v => v.word);
    const options = [item.word, ...randomDistractors].sort(() => 0.5 - Math.random());

    return {
      ...item,
      maskedSentence,
      options,
      selectedAnswer: '',
      checked: false
    };
  });

  // 4. NGHE PHẢN XẠ ĐOẠN VĂN (Listening Reflex - 100% English)
  // 4 audio passages x 5 questions = 20 questions
  part4Data = [];
  const listeningPool = getUnusedItems(20);
  for (let p = 0; p < 4; p++) {
    const subset = listeningPool.slice(p * 5, (p + 1) * 5);
    const passageTitle = `Workplace Scenario ${p + 1}: Professional Operations & Strategy`;
    
    // Đoạn văn tiếng Anh tự nhiên mạch lạc kết nối 5 từ vựng cốt lõi
    const passage = `Attention all team members. To ${subset[0].word} our strategic targets this quarter, our department has decided to implement immediate improvements across all divisions. First of all, please keep in mind that ${subset[1].example} Furthermore, when discussing terms with international suppliers, remember that ${subset[2].example} In addition, our supervisors emphasized that ${subset[3].example} Finally, managing every ${subset[4].word} with precision will ensure our sustained competitive advantage and operational excellence.`;

    const questions = subset.map((item, qIdx) => {
      // Các dạng câu hỏi nghe hiểu phản xạ thực tế (Listening comprehension questions)
      const questionTypes = [
        {
          questionText: `According to the speaker, what is the primary prerequisite to succeed?`,
          correctOption: `The team must focus on how to ${item.word} effectively.`,
          distractor1: `The department should cancel all supplier negotiations immediately.`,
          distractor2: `Employees must reduce direct communication with managers.`,
          distractor3: `The company should avoid making any structural improvements.`
        },
        {
          questionText: `What specific instruction did the speaker give regarding ongoing operations?`,
          correctOption: item.example,
          distractor1: `Delivery dates should be postponed indefinitely without notification.`,
          distractor2: `Quality control procedures should be bypassed to reduce manufacturing costs.`,
          distractor3: `All operations will be handed over to temporary contractors tomorrow.`
        },
        {
          questionText: `Based on the audio, which core element was highlighted as essential?`,
          correctOption: `Paying strict attention to each ${item.word} throughout the process.`,
          distractor1: `Ignoring client feedback during seasonal product launches.`,
          distractor2: `Increasing the overall budget without proper approval.`,
          distractor3: `Delaying team meetings until the end of the year.`
        },
        {
          questionText: `In the context of the audio passage, what does the keyword "${item.word}" refer to?`,
          correctOption: `An essential operational action or objective: "${item.example}".`,
          distractor1: `An unimportant routine that does not affect results.`,
          distractor2: `An obsolete procedure that will be completely discontinued.`,
          distractor3: `A minor factor that the management does not prioritize.`
        },
        {
          questionText: `What is the ultimate recommendation delivered by the speaker?`,
          correctOption: `To ${item.word} systematically to ensure long-term excellence.`,
          distractor1: `To stop tracking business inventory on a monthly basis.`,
          distractor2: `To renegotiate payment conditions with zero warranty coverage.`,
          distractor3: `To decrease collaboration between engineers and supervisors.`
        }
      ];

      const template = questionTypes[qIdx % questionTypes.length];
      const allOptions = [
        template.correctOption,
        template.distractor1,
        template.distractor2,
        template.distractor3
      ].sort(() => 0.5 - Math.random());

      return {
        targetWord: item.word,
        meaning: item.meaning,
        questionText: template.questionText,
        options: allOptions,
        correctOption: template.correctOption,
        selectedAnswer: '',
        checked: false
      };
    });

    part4Data.push({ passageId: p + 1, passageTitle, passage, questions });
  }

  updateTrackerUI();
  renderTab();

  if (scrollUp) {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

// BỘ PHÂN TÍCH NGỮ PHÁP NỘI BỘ
function analyzeTranslation(userText, targetText, coreWord) {
  const cleanU = userText.trim().toLowerCase().replace(/[^a-z0-9 ]/g, '');
  const cleanT = targetText.trim().toLowerCase().replace(/[^a-z0-9 ]/g, '');
  
  if (!cleanU) {
    return { isCorrect: false, comment: "Bạn chưa nhập câu trả lời." };
  }

  const uWords = cleanU.split(/\s+/);
  const tWords = cleanT.split(/\s+/);
  
  const coreRegex = new RegExp(`\\b${coreWord.toLowerCase()}\\b`);
  if (!coreRegex.test(cleanU)) {
    return { 
      isCorrect: false, 
      comment: `Câu của bạn còn thiếu hoặc viết sai từ cốt lõi <strong>"${coreWord}"</strong>.` 
    };
  }

  for (let i = 0; i < tWords.length - 1; i++) {
    const pair = `${tWords[i]} ${tWords[i+1]}`;
    const reversedPair = `${tWords[i+1]} ${tWords[i]}`;
    if (cleanU.includes(reversedPair) && !cleanU.includes(pair)) {
      return {
        isCorrect: false,
        comment: `Sai trật tự từ: Viết <code>"${reversedPair}"</code> là chưa chuẩn, phải là <code>"${pair}"</code>.`
      };
    }
  }

  let matchCount = 0;
  uWords.forEach(w => {
    if (tWords.includes(w)) matchCount++;
  });

  const similarity = (2.0 * matchCount) / (uWords.length + tWords.length);

  if (similarity >= 0.72) {
    return { 
      isCorrect: true, 
      comment: `Rất tốt! Câu viết tự nhiên, đúng cấu trúc và đúng từ cốt lõi.` 
    };
  } else {
    return {
      isCorrect: false,
      comment: `Câu chưa sát cấu trúc ngữ pháp. Đối chiếu với câu chuẩn bên dưới nhé.`
    };
  }
}

// CHẤM TỪNG CÂU CHO PHẦN 1, 2, 3
function checkSingleQuestion(part, idx) {
  if (part === 1) {
    const item = part1Data[idx];
    const inputEl = document.querySelector(`#p1_card_${idx} .input-answer`);
    if (inputEl) item.userAnswer = inputEl.value;

    const fb = document.getElementById(`p1_fb_${idx}`);
    if (!fb) return;
    const result = analyzeTranslation(item.userAnswer || '', item.example, item.word);
    fb.style.display = 'block';
    if (result.isCorrect) {
      fb.className = 'feedback correct';
      fb.innerHTML = `<strong>✅ Correct! (Chính xác)</strong><br>${result.comment}<br>📌 Standard Sentence: <i>${item.example}</i>`;
    } else {
      fb.className = 'feedback wrong';
      fb.innerHTML = `<strong>❌ Incorrect (Chưa chính xác):</strong><br>💡 <strong>Góp ý:</strong> ${result.comment}<br>📌 <strong>Standard Sentence:</strong> <strong>${item.example}</strong>`;
    }
  } else if (part === 2) {
    const item = part2Data[idx];
    const inputEl = document.querySelector(`#p2_card_${idx} .input-answer`);
    if (inputEl) item.userAnswer = inputEl.value;

    const fb = document.getElementById(`p2_fb_${idx}`);
    if (!fb) return;
    const cleanUser = (item.userAnswer || '').trim().toLowerCase();
    const cleanTarget = item.word.trim().toLowerCase();
    fb.style.display = 'block';
    if (cleanUser === cleanTarget) {
      fb.className = 'feedback correct';
      fb.innerHTML = `<strong>✅ Correct!</strong> Missing word: <strong>${item.word}</strong>`;
    } else {
      fb.className = 'feedback wrong';
      fb.innerHTML = `<strong>❌ Incorrect!</strong> Correct word is: <strong>${item.word}</strong> (You typed: "${item.userAnswer || '(empty)'}")`;
    }
  } else if (part === 3) {
    const item = part3Data[idx];
    const fb = document.getElementById(`p3_fb_${idx}`);
    if (!fb) return;
    if (!item.selectedAnswer) {
      fb.style.display = 'block';
      fb.className = 'feedback wrong';
      fb.innerHTML = `⚠️ Please select an answer before checking!`;
      return;
    }
    fb.style.display = 'block';
    if (item.selectedAnswer === item.word) {
      fb.className = 'feedback correct';
      fb.innerHTML = `<strong>✅ Correct!</strong> Answer: <strong>${item.word}</strong>`;
    } else {
      fb.className = 'feedback wrong';
      fb.innerHTML = `<strong>❌ Incorrect!</strong> Correct answer is: <strong>${item.word}</strong>`;
    }
  }
}

// CHẤM TỪNG CÂU CHO PHẦN 4 NGHE PHẢN XẠ (100% English)

// Nạp file Excel
function parseWorkbook(workbook) {
  const firstSheetName = workbook.SheetNames[0];
  const worksheet = workbook.Sheets[firstSheetName];
  const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
  if (json.length < 2) return false;

  const headers = json[0].map(h => (h || '').toString().toLowerCase().trim());
  let wordIdx = headers.findIndex(h => h.includes('word') || h.includes('từ') || h.includes('vocabulary'));
  let meanIdx = headers.findIndex(h => h.includes('meaning') || h.includes('nghĩa') || h.includes('dịch'));
  let exIdx = headers.findIndex(h => h.includes('example') || h.includes('ví dụ') || h.includes('sentence') || h.includes('câu'));
  let transIdx = headers.findIndex(h => h.includes('trans') || h.includes('nghĩa câu') || h.includes('dịch câu'));

  if (wordIdx === -1) wordIdx = 0;
  if (meanIdx === -1) meanIdx = 1;
  if (exIdx === -1) exIdx = 2;
  if (transIdx === -1) transIdx = 3;

  const parsedWords = [];
  for (let i = 1; i < json.length; i++) {
    const row = json[i];
    if (!row || !row[wordIdx]) continue;
    const word = String(row[wordIdx]).trim();
    const meaning = row[meanIdx] ? String(row[meanIdx]).trim() : '';
    let example = row[exIdx] ? String(row[exIdx]).trim() : '';
    let trans = row[transIdx] ? String(row[transIdx]).trim() : '';

    if (!example) example = `We should focus on ${word} to achieve better results.`;
    if (!trans) trans = `Chúng ta nên tập trung vào (${meaning || word}) để đạt kết quả tốt hơn.`;

    parsedWords.push({ word, meaning, example, trans });
  }

  if (parsedWords.length > 0) {
    vocabList = parsedWords;
    usedWordsSet.clear();
    generateNewQuizzes(false);
    return true;
  }
  return false;
}

window.addEventListener('DOMContentLoaded', () => {
  fetch('./vocab.xlsx')
    .then(res => {
      if (!res.ok) throw new Error("Chưa có vocab.xlsx");
      return res.arrayBuffer();
    })
    .then(data => {
      const workbook = XLSX.read(new Uint8Array(data), { type: 'array' });
      parseWorkbook(workbook);
    })
    .catch(() => {
      generateNewQuizzes(false);
    });
});

document.getElementById('manualFileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    const data = new Uint8Array(evt.target.result);
    const workbook = XLSX.read(data, { type: 'array' });
    parseWorkbook(workbook);
  };
  reader.readAsArrayBuffer(file);
});
